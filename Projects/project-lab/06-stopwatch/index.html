<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stopwatch</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#eef;font-family:system-ui}.card{background:#142138;padding:32px;border-radius:20px;text-align:center}h1{font-size:34px}output{display:block;font-size:52px;margin:25px}button{padding:12px 20px;margin:5px;border:0;border-radius:9px;cursor:pointer}</style></head><body><main class="card"><a href="../index.html">← Project Lab</a><h1>Stopwatch</h1><output id="time">00:00.0</output><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button></main><script>let start=0,elapsed=0,timer=null;const out=document.getElementById('time');function draw(){let x=elapsed+(timer?Date.now()-start:0),s=Math.floor(x/1000),d=Math.floor(x%1000/100);out.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+d}document.getElementById('start').onclick=()=>{if(!timer){start=Date.now();timer=setInterval(draw,100)}};document.getElementById('pause').onclick=()=>{if(timer){elapsed+=Date.now()-start;clearInterval(timer);timer=null;draw()}};document.getElementById('reset').onclick=()=>{clearInterval(timer);timer=null;elapsed=0;draw()};</script></body></html>
