<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tip Calculator | Project Lab</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1220;color:#e8eef9;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:#121d30;border:1px solid #293952;border-radius:22px;padding:28px;box-shadow:0 18px 60px #0005}a{color:#8fc5ff;text-decoration:none}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.tag{font-size:12px;color:#a7c7ef;border:1px solid #355174;border-radius:99px;padding:6px 10px}h1{font-size:clamp(25px,5vw,38px);margin:24px 0 8px}p{color:#aebbd0;line-height:1.6}form{display:grid;gap:14px;margin-top:24px}label{display:grid;gap:7px;color:#cbd7e8;font-size:14px}input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #34465f;background:#0b1423;color:#fff;font:inherit}button{padding:13px 18px;border:0;border-radius:10px;background:#74aef4;color:#071322;font-weight:700;font:inherit;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1422;border:1px solid #2d405a;border-radius:12px;padding:16px;min-height:58px;color:#bce2c9;line-height:1.55}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:20px;color:#8294ae;font-size:12px;flex-wrap:wrap}
</style></head><body><main class="card"><div class="top"><a href="../index.html">← Project Lab</a><span class="tag">Beginner · 01</span></div><h1>Tip Calculator</h1><p>Calculate tip, tax and split bills.</p><form id="tool"><label>Bill amount<input id="f0" type="text" placeholder="Bill amount" required></label>
<label>Tip %<input id="f1" type="text" placeholder="Tip %" ></label>
<label>People<input id="f2" type="text" placeholder="People" ></label><button type="submit">Run project</button></form><h2 style="font-size:16px;margin-top:24px">Output</h2><pre id="out" aria-live="polite">Your result will appear here.</pre><div class="foot"><span>Built with HTML, CSS and JavaScript</span><span>Practice project · Improve it yourself</span></div></main><script>
document.getElementById('tool').addEventListener('submit',e=>{e.preventDefault();const v=[document.getElementById('f0').value,document.getElementById('f1').value,document.getElementById('f2').value];const out=document.getElementById('out');try{const result=(()=>{const b=+v[0],t=+v[1],p=Math.max(1,+v[2]); if(b<0||t<0) throw Error('Enter non-negative values'); const tip=b*t/100; return `Tip: ₹${tip.toFixed(2)} | Total: ₹${(b+tip).toFixed(2)} | Per person: ₹${((b+tip)/p).toFixed(2)}`;})();out.textContent=String(result)}catch(err){out.textContent='Error: '+err.message}});
</script></body></html>
