<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter | Project Lab</title><style>:root{color-scheme:dark;font-family:system-ui}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1220;color:#e8eef9;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);background:#121d30;border:1px solid #293952;border-radius:22px;padding:28px}a{color:#8fc5ff;text-decoration:none}h1{font-size:clamp(25px,5vw,38px);margin:24px 0 8px}p{color:#aebbd0;line-height:1.6}form{display:grid;gap:14px;margin-top:24px}label{display:grid;gap:7px;color:#cbd7e8;font-size:14px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #34465f;background:#0b1423;color:white;font:inherit}button{padding:13px 18px;border:0;border-radius:10px;background:#74aef4;color:#071322;font-weight:700;font:inherit;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1422;border:1px solid #2d405a;border-radius:12px;padding:16px;min-height:58px;color:#bce2c9;line-height:1.55}</style></head><body><main class="card"><a href="../index.html">← Project Lab</a><h1>Word Counter</h1><p>Count words, characters and lines.</p><form id="tool"><label>Text<input id="f0" type="text" placeholder="Text" required></label><button>Run project</button></form><h2 style="font-size:16px;margin-top:24px">Output</h2><pre id="out" aria-live="polite">Your result appears here.</pre><small>HTML · CSS · JavaScript | Beginner practice project</small></main><script>document.getElementById('tool').addEventListener('submit',e=>{e.preventDefault();const v=[document.getElementById('f0').value],out=document.getElementById('out');try{out.textContent=String((()=>{const t=v[0],w=t.trim()?t.trim().split(/\s+/).length:0;return `Words ${w} · Characters ${t.length} · Lines ${t?t.split('\n').length:0}`})())}catch(err){out.textContent='Error: '+err.message}});</script></body></html>
